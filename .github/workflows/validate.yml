name: Validate application
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, work/version-1-0-business-capacity, fix/auth-db-smoke-and-entitlements]
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gde_pribyl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gde_pribyl_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gde_pribyl_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run check
      - run: npm test
      - name: Check inline browser JavaScript
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>([\s\S]*?)</script>", html)
          if len(scripts) != 1:
              raise SystemExit(f"Expected one inline script, found {len(scripts)}")
          Path("/tmp/site-inline.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/site-inline.js
