services:
  - type: web
    name: gde-pribyl-mp-api
    runtime: node
    plan: starter
    region: frankfurt
    branch: version-0.8
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: gde-pribyl-mp-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ROBOKASSA_MERCHANT_LOGIN
        sync: false
      - key: ROBOKASSA_PASSWORD_1
        sync: false
      - key: ROBOKASSA_PASSWORD_2
        sync: false
  - type: worker
    name: gde-pribyl-mp-billing
    runtime: node
    plan: starter
    region: frankfurt
    branch: version-0.8
    buildCommand: npm install
    startCommand: npm run worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: gde-pribyl-mp-db
          property: connectionString
      - key: ROBOKASSA_MERCHANT_LOGIN
        sync: false
      - key: ROBOKASSA_PASSWORD_1
        sync: false
      - key: ROBOKASSA_PASSWORD_2
        sync: false
databases:
  - name: gde-pribyl-mp-db
    databaseName: gde_pribyl_mp
    user: gde_pribyl_mp
    plan: basic_256mb
    region: frankfurt
    postgresMajorVersion: 18
